name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned to Ubuntu 24.04, so the test machine changes only when this file does
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the tests never need GitHub access
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests (simulated Ollama, no model needed)
        run: python -m unittest discover -s tests
